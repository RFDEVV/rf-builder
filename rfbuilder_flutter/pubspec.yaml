name: rfbuilder_app
description: RF Builder - aplikasi Android (shell native + UI web RF Builder).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.1.5
  google_sign_in: ">=6.2.2 <7.0.0"
  onesignal_flutter: ^5.3.0
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3
  video_player: ^2.9.2
  dio: ^5.7.0
  open_filex: ^4.6.0
  share_plus: ^10.1.2
  url_launcher: ^6.3.1
  permission_handler: ^11.3.1
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.2

flutter:
  uses-material-design: true
  assets:
    - assets/splash/
    - assets/branding/

# Ganti assets/branding/icon.png lalu jalankan: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/icon.png"
  adaptive_icon_background: "#07070e"
  adaptive_icon_foreground: "assets/branding/icon.png"

# Splash native (sebelum Flutter jalan). Jalankan: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#07070e"
  android_12:
    color: "#07070e"
